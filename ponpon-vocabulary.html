<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ぽんぽん英単語</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f6f7fb;--card:#fff;--primary:#4a5acf;--primary-light:#eef0ff;
  --correct:#22c55e;--correct-bg:#f0fdf4;--wrong:#ef4444;--wrong-bg:#fef2f2;
  --w1:#f59e0b;--w1bg:#fffbeb;--w1bd:#fbbf24;
  --w2:#f97316;--w2bg:#fff7ed;--w2bd:#fb923c;
  --w3:#ef4444;--w3bg:#fef2f2;--w3bd:#f87171;
  --text:#1e293b;--sub:#64748b;--border:#e2e8f0;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
  --r:16px;
}
body{font-family:'Inter','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}
.app{max-width:440px;margin:0 auto;padding:16px;min-height:100dvh;display:flex;flex-direction:column}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 0 12px}
.hdr h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;transition:all .15s}
.ib:active{transform:scale(.95)}

/* Tabs */
.tabs{display:flex;gap:3px;background:var(--card);border-radius:12px;padding:3px;box-shadow:var(--shadow);margin-bottom:12px}
.tab{flex:1;padding:9px 4px;text-align:center;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--sub);white-space:nowrap;transition:all .15s}
.tab.active{background:var(--primary);color:#fff}
.tab.tw.active{background:var(--w1);color:#fff}
.tbdg{display:inline-block;background:var(--w1);color:#fff;font-size:9px;font-weight:700;border-radius:7px;padding:1px 4px;margin-left:2px;vertical-align:middle}
.tab.active .tbdg{background:rgba(255,255,255,.3)}

/* Range bar */
.rbar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.rbar::-webkit-scrollbar{display:none}
.rchip{flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:500;border:1.5px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s;white-space:nowrap}
.rchip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.rchip .cp{display:inline-block;margin-left:4px;font-size:11px;opacity:.7}

/* Progress */
.pw{margin-bottom:12px}
.pb{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.pf{height:100%;background:var(--primary);border-radius:3px;transition:width .3s}
.pt{font-size:11px;color:var(--sub);margin-top:4px;text-align:right}

/* Controls row */
.cr{display:flex;gap:6px;margin-bottom:12px;justify-content:flex-end;flex-wrap:wrap}
.sb{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:500;border:1.5px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s;color:var(--sub)}
.sb.active{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
.sb:active{transform:scale(.95)}

/* Flashcard */
.cc{flex:1;display:flex;flex-direction:column;justify-content:center;perspective:1000px}
.fc{position:relative;width:100%;min-height:260px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,0,.2,1)}
.fc.fl{transform:rotateY(180deg)}
.cf{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px}
.cb{transform:rotateY(180deg)}
.cn{font-size:12px;color:var(--sub);margin-bottom:8px;font-weight:500}
.cw{font-size:26px;font-weight:700;letter-spacing:-.5px;text-align:center;line-height:1.3}
.cm{font-size:21px;font-weight:600;text-align:center;line-height:1.5}
.ch{font-size:12px;color:var(--primary);margin-top:14px;opacity:.7}
.cwm{position:absolute;top:14px;right:16px;font-size:16px;opacity:.8}

/* Card action buttons */
.ca{display:flex;gap:10px;margin-top:18px;justify-content:center}
.cab{padding:12px 6px;border-radius:12px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .15s;flex:1;text-align:center}
.cab:active{transform:scale(.95)}
.cab.cpv{background:var(--card);border:1.5px solid var(--border);color:var(--text);flex:0 0 auto;padding:12px 18px}
.cab.cwrn{background:var(--w1bg);border:1.5px solid var(--w1bd);color:#92400e}
.cab.cok{background:var(--primary);color:#fff}

/* Quiz */
.qq{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:28px 24px;text-align:center;margin-bottom:14px;position:relative}
.qw{font-size:24px;font-weight:700}
.qp{font-size:13px;color:var(--sub);margin-top:8px}
.qos{display:flex;flex-direction:column;gap:8px}
.qo{padding:14px 18px;border-radius:14px;background:var(--card);border:1.5px solid var(--border);font-size:15px;line-height:1.5;cursor:pointer;transition:all .15s;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.qo:active{transform:scale(.98)}
.qo.sc{background:var(--correct-bg);border-color:var(--correct);color:#166534}
.qo.sw{background:var(--wrong-bg);border-color:var(--wrong);color:#991b1b}
.qo.rc{background:var(--correct-bg);border-color:var(--correct);color:#166534}
.qo.dis{pointer-events:none;opacity:.6}
.qn{margin-top:16px;width:100%;padding:13px;border-radius:12px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;border:none;cursor:pointer}
.qn:active{transform:scale(.98)}

/* List */
.wl{flex:1;overflow-x:auto}
.lctl{display:flex;gap:6px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.lctl-left{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.ltog{padding:5px 10px;border-radius:8px;font-size:11px;font-weight:600;border:1.5px solid var(--border);background:var(--card);cursor:pointer;color:var(--sub);transition:all .15s;white-space:nowrap}
.ltog.on{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
.ltog:active{transform:scale(.95)}
.lf{padding:4px 9px;border-radius:14px;font-size:11px;font-weight:600;border:1.5px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s;white-space:nowrap}
.lf.active{color:#fff}
.lf.fa.active{background:var(--primary);border-color:var(--primary)}
.lf.fm.active{background:#8b5cf6;border-color:#8b5cf6}
.lf.fo.active{background:var(--correct);border-color:var(--correct)}
.lf.ft.active{background:var(--w1);border-color:var(--w1)}
.lf.fn.active{background:var(--sub);border-color:var(--sub)}
.wtbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);font-size:13px;table-layout:fixed}
.wtbl col.c-n{width:34px}.wtbl col.c-e{width:30%}.wtbl col.c-r{width:82px}.wtbl col.c-m{}
.wtbl th{padding:6px 3px;font-size:11px;font-weight:600;color:var(--sub);text-align:left;border-bottom:2px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--card);z-index:1}
.wtbl th:first-child{padding-left:8px}
.wtbl td{padding:5px 3px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.wtbl td:first-child{padding-left:8px;color:var(--sub);font-size:11px;font-weight:600;white-space:nowrap}
.wtbl tr:last-child td{border-bottom:none}
.wtbl tr.rm td:first-child{box-shadow:inset 3px 0 0 #8b5cf6}
.wtbl tr.ro td:first-child{box-shadow:inset 3px 0 0 var(--correct)}
.wtbl tr.rt td:first-child{box-shadow:inset 3px 0 0 var(--w1)}
.wtbl .te{font-weight:600;overflow-wrap:break-word;word-break:break-word}
.wtbl .tm{color:var(--sub);cursor:pointer;-webkit-user-select:none;user-select:none;overflow-wrap:break-word;word-break:break-word;line-height:1.5}
.wtbl .tm-h{color:#ccc;font-size:11px}
.wtbl .tm-h .hn{color:var(--text);font-style:normal;font-weight:600;font-size:12px}
.wtbl .tr{white-space:nowrap}
.rbtn{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--border);background:var(--card);font-size:11px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .12s;padding:0;vertical-align:middle;margin:0 1px}
.rbtn:active{transform:scale(.9)}
.rbtn.r-m{color:#8b5cf6}
.rbtn.r-m.sel{background:#ede9fe;border-color:#8b5cf6}
.rbtn.r-o{color:var(--correct)}
.rbtn.r-o.sel{background:var(--correct-bg);border-color:var(--correct)}
.rbtn.r-t{color:var(--w1)}
.rbtn.r-t.sel{background:var(--w1bg);border-color:var(--w1)}
/* reused in △ list */
.wi{background:var(--card);border-radius:12px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.03);position:relative;overflow:hidden}
.wi.w1{border-left:3px solid var(--w1)}.wi.w2{border-left:3px solid var(--w2)}.wi.w3{border-left:3px solid var(--w3)}
.wi-top{display:flex;align-items:center;gap:8px;padding:10px 14px}
.win{font-size:11px;color:var(--sub);font-weight:600;min-width:24px;flex-shrink:0}
.wie{font-size:14px;font-weight:600;flex:1;min-width:0}
.wim{font-size:13px;color:var(--sub);flex:1}
.wir{font-size:14px;cursor:pointer;padding:4px 8px;border:none;background:none;opacity:.4;flex-shrink:0}
.wir:hover{opacity:1;color:var(--wrong)}
.wic{font-size:11px;color:var(--w1);font-weight:700;margin-left:4px;flex-shrink:0}

/* Empty & Complete */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
.empty .ei{font-size:48px;margin-bottom:12px;opacity:.6}
.empty p{font-size:14px;color:var(--sub);line-height:1.6}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.done .de{font-size:52px;margin-bottom:14px}
.done h2{font-size:20px;font-weight:700;margin-bottom:8px}
.done p{font-size:14px;color:var(--sub);margin-bottom:20px}
.done button{padding:12px 28px;border-radius:12px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;border:none;cursor:pointer}

/* Passage (長文) */
.pass-gen{text-align:center;padding:40px 20px}
.pass-gen p{font-size:14px;color:var(--sub);margin-bottom:16px;line-height:1.6}
.pass-btn{padding:14px 32px;border-radius:14px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
.pass-btn:active{transform:scale(.95)}
.pass-btn:disabled{opacity:.5;pointer-events:none}
.pass-loading{text-align:center;padding:40px 20px}
.pass-loading .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.pass-loading p{font-size:14px;color:var(--sub)}
.passage-box{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:24px 20px;line-height:1.9;font-size:15px}
.passage-box mark{background:var(--primary-light);color:var(--primary);padding:1px 4px;border-radius:4px;font-weight:600}
.pass-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pass-meta span{font-size:12px;color:var(--sub)}
.pass-regen{font-size:12px;color:var(--primary);cursor:pointer;border:none;background:none;font-weight:600}
.pass-error{text-align:center;padding:20px;color:var(--wrong);font-size:14px}
.pass-lang{display:flex;gap:4px;background:var(--card);border-radius:10px;padding:3px;box-shadow:var(--shadow);margin-bottom:12px}
.pass-lang button{flex:1;padding:8px;border-radius:8px;font-size:13px;font-weight:600;border:none;background:transparent;color:var(--sub);cursor:pointer;transition:all .15s}
.pass-lang button.active{background:var(--primary);color:#fff}
.passage-box.ja{line-height:2;font-size:14px}
.passage-box.ja mark{background:#fef3c7;color:#92400e}

/* Filter chips for △ */
.frow{display:flex;gap:6px;margin-bottom:12px}
.fchip{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s}
.fchip.active{color:#fff}
.fchip.f0.active{background:var(--w1);border-color:var(--w1)}
.fchip.f1.active{background:var(--w1);border-color:var(--w1)}
.fchip.f2.active{background:var(--w2);border-color:var(--w2)}
.fchip.f3.active{background:var(--w3);border-color:var(--w3)}

/* Settings */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fi .2s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.sh{background:var(--card);border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:440px;max-height:80dvh;overflow-y:auto;animation:su .3s cubic-bezier(.4,0,.2,1)}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sh h2{font-size:17px;font-weight:700;margin-bottom:16px}
.sh-sec{font-size:12px;font-weight:600;color:var(--sub);padding:12px 0 4px;border-top:1px solid var(--border);margin-top:4px}
.sh-sec:first-of-type{border-top:none;margin-top:0}
.sr{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.sl{font-size:14px}
.sb.sb-pri{background:var(--primary);color:#fff;border-color:var(--primary)}
.sh-msg{font-size:13px;padding:10px 14px;border-radius:10px;margin:8px 0;text-align:center;animation:fi .3s}
.sh-msg.ok{background:var(--correct-bg);color:#166534}
.sh-msg.err{background:var(--wrong-bg);color:#991b1b}
.sc{margin-top:16px;width:100%;padding:12px;border-radius:12px;background:var(--bg);border:none;font-size:14px;font-weight:600;cursor:pointer}
</style>
</head>

  return[...new Set(h)];
}
function getWrongEntries(minC){
  let e=[];
  for(let i=0;i<2600;i++)DATA[i][1].forEach(([f,m])=>{
    const c=S.wrongs[f]||0;
    if(minC===0?c>0:c>=minC)e.push({n:i+1,f,m,wc:c});
  });
  return e;
}
function wrongCount(){return Object.keys(S.wrongs).filter(k=>S.wrongs[k]>0).length}
function wrongCountMin(n){let c=0;for(let k in S.wrongs)if(n===0?S.wrongs[k]>0:S.wrongs[k]>=n)c++;return c}
function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function buildOrder(){
  let e;
  if(S.mode==='triangle'){
    const mc=S.tfilter===0?0:S.tfilter;
    e=getWrongEntries(mc);
    if(S.tfilter>0)e=e.filter(x=>x.wc>=S.tfilter);
  }else{
    e=getEntries(S.ri);
  }
  S.order=S.shuf?shuf(e):e;S.ci=0;S.flip=false;S.qa=null;S.qo=[];
}
function getRangeProgress(ri){
  const r=RNG[ri];let t=0,c=0;
  for(let i=r.s;i<r.e;i++)DATA[i][1].forEach(([f])=>{t++;if(S.prog[f])c++});
  return{t,c};
}
function mkQuiz(cur,pool){
  if(S.dir==='en2jp'){
    let o=pool.filter(e=>e.m!==cur.m);o=shuf(o).slice(0,3);
    let r=o.map(e=>({d:e.m,ok:false}));r.push({d:cur.m,ok:true});return shuf(r);
  }else{
    let o=pool.filter(e=>e.f!==cur.f);o=shuf(o).slice(0,3);
    let r=o.map(e=>({d:e.f,ok:false}));r.push({d:cur.f,ok:true});return shuf(r);
  }
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function wcLabel(c){return c>=3?'△△△':c===2?'△△':'△'}
function wcClass(c){return c>=3?'w3':c===2?'w2':'w1'}

function addWrong(form){
  S.wrongs[form]=(S.wrongs[form]||0)+1;
  sv('pp_wrongs',S.wrongs);
}

function render(){
  const sy=window.scrollY;
  const ent=S.order;const cur=ent[S.ci];const wc=wrongCount();
  let h='';

  h+=`<div class="hdr"><h1>ぽんぽん英単語</h1><button class="ib" onclick="togSet()">⚙</button></div>`;

  // Mode tabs
  h+=`<div class="tabs">
    <button class="tab ${S.mode==='list'?'active':''}" onclick="setMode('list')">一覧</button>
    <button class="tab ${S.mode==='flash'?'active':''}" onclick="setMode('flash')">カード</button>
    <button class="tab ${S.mode==='quiz'?'active':''}" onclick="setMode('quiz')">クイズ</button>
    <button class="tab ${S.mode==='passage'?'active':''}" onclick="setMode('passage')">長文</button>
    <button class="tab ${S.mode==='triangle'?'active':''} ${S.mode==='triangle'?'tw':''}" onclick="setMode('triangle')">△${wc?`<span class="tbdg">${wc}</span>`:''}</button>
  </div>`;

  // ===== TRIANGLE MODE =====
  if(S.mode==='triangle'){
    h+=renderTriangle();
    if(S.showSet)h+=renderSettings();
    app.innerHTML=h;window.scrollTo(0,sy);return;
  }

  // ===== PASSAGE MODE =====
  if(S.mode==='passage'){
    h+=renderRangeBar();
    h+=renderPassage();
    if(S.showSet)h+=renderSettings();
    app.innerHTML=h;window.scrollTo(0,sy);return;
  }

  // ===== NORMAL MODES =====
  h+=renderRangeBar();
  const rp=getRangeProgress(S.ri);
  const pct=rp.t?Math.round(rp.c/rp.t*100):0;
  h+=`<div class="pw"><div class="pb"><div class="pf" style="width:${pct}%"></div></div><div class="pt">${rp.c}/${rp.t} 語マスター</div></div>`;

  if(!ent.length){h+=`<div class="empty"><p>データがありません</p></div>`;if(S.showSet)h+=renderSettings();app.innerHTML=h;window.scrollTo(0,sy);return}

  h+=`<div class="cr">
    <button class="sb ${S.dir==='jp2en'?'active':''}" onclick="togDir()">${S.dir==='en2jp'?'英→和':'和→英'}</button>
    <button class="sb ${S.shuf?'active':''}" onclick="togShuf()">${S.shuf?'🔀 ON':'シャッフル'}</button>
  </div>`;

  if(S.mode==='flash')h+=renderFlash(ent,cur);
  else if(S.mode==='quiz')h+=renderQuiz(ent,cur,getEntries(S.ri));
  else if(S.mode==='list')h+=renderList(ent);

  if(S.showSet)h+=renderSettings();
  app.innerHTML=h;
  window.scrollTo(0,sy);
  if(S._scrollChip){
    S._scrollChip=false;
    const ac=document.querySelector('.rchip.active');
    if(ac)ac.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  }
}

function renderRangeBar(){
  let h='<div class="rbar">';
  RNG.forEach((r,i)=>{
    const p=getRangeProgress(i);const pp=p.t?Math.round(p.c/p.t*100):0;
    const dot=pp===100?'✓':pp>0?pp+'%':'';
    h+=`<div class="rchip ${i===S.ri?'active':''}" onclick="selRange(${i})">${r.l}${dot?`<span class="cp">${dot}</span>`:''}</div>`;
  });
  return h+'</div>';
}

function renderFlash(ent,cur){
  if(S.ci>=ent.length)return`<div class="done"><div class="de">🎉</div><h2>完了！</h2><p>ひと通り見ました</p><button onclick="buildOrder();render()">もう一度</button></div>`;
  const front=S.dir==='en2jp'?cur.f:cur.m;
  const back=S.dir==='en2jp'?cur.m:cur.f;
  const wc=S.wrongs[cur.f]||0;
  const wmk=wc?`<div class="cwm" style="color:var(--${wcClass(wc)})">${wcLabel(wc)}</div>`:'';
  return`<div class="cc">
    <div class="fc ${S.flip?'fl':''}" onclick="flipCard()">
      <div class="cf">${wmk}<div class="cn">No.${cur.n}（${S.ci+1}/${ent.length}）</div><div class="cw">${esc(front)}</div><div class="ch">タップで裏面</div></div>
      <div class="cf cb">${wmk}<div class="cn">No.${cur.n}</div><div class="cm">${esc(back)}</div></div>
    </div>
    <div class="ca">
      <button class="cab cpv" onclick="prevCard()" ${S.ci===0?'disabled':''}>←</button>
      <button class="cab cwrn" onclick="markWrong()">△ 不安</button>
      <button class="cab cok" onclick="markOk()">✓ 次へ</button>
    </div>
  </div>`;
}

function renderQuiz(ent,cur,pool){
  if(S.ci>=ent.length)return`<div class="done"><div class="de">🏆</div><h2>クイズ完了！</h2><button onclick="resetQuiz()">もう一度</button></div>`;
  if(!S.qo.length)S.qo=mkQuiz(cur,pool.length>=4?pool:ent);
  const q=S.dir==='en2jp'?cur.f:cur.m;
  const pr=S.dir==='en2jp'?'意味を選んでください':'英語を選んでください';
  const wc=S.wrongs[cur.f]||0;
  const wmk=wc?`<div class="cwm" style="color:var(--${wcClass(wc)})">${wcLabel(wc)}</div>`:'';
  let h=`<div class="qq">${wmk}<div class="cn">No.${cur.n}（${S.ci+1}/${ent.length}）</div><div class="qw">${esc(q)}</div><div class="qp">${pr}</div></div><div class="qos">`;
  S.qo.forEach((o,i)=>{
    let c='qo';
    if(S.qa!==null){
      if(i===S.qa&&o.ok)c+=' sc';
      else if(i===S.qa&&!o.ok)c+=' sw';
      else if(o.ok)c+=' rc';
      else c+=' dis';
    }
    h+=`<div class="${c}" onclick="ansQuiz(${i})">${esc(o.d)}</div>`;
  });
  h+='</div>';
  if(S.qa!==null)h+=`<button class="qn" onclick="nxtQuiz()">次の問題 →</button>`;
  return h;
}

function renderList(entries){
  _fl=[];
  let cM=0,cO=0,cT=0,cN=0;
  entries.forEach(e=>{const r=S.ratings[e.f];if(r==='◎')cM++;else if(r==='○')cO++;else if(r==='△')cT++;else cN++});

  let filtered=entries;
  const lf=S.listFilter;
  if(lf==='◎')filtered=entries.filter(e=>S.ratings[e.f]==='◎');
  else if(lf==='○')filtered=entries.filter(e=>S.ratings[e.f]==='○');
  else if(lf==='△')filtered=entries.filter(e=>S.ratings[e.f]==='△');
  else if(lf==='none')filtered=entries.filter(e=>!S.ratings[e.f]);

  let h='';
  h+=`<div class="lctl">
    <div class="lctl-left">
      <button class="lf fa ${lf==='all'?'active':''}" onclick="setLF('all')">全${entries.length}</button>
      <button class="lf fm ${lf==='◎'?'active':''}" onclick="setLF('◎')">◎${cM}</button>
      <button class="lf fo ${lf==='○'?'active':''}" onclick="setLF('○')">○${cO}</button>
      <button class="lf ft ${lf==='△'?'active':''}" onclick="setLF('△')">△${cT}</button>
      <button class="lf fn ${lf==='none'?'active':''}" onclick="setLF('none')">未${cN}</button>
    </div>
    <button class="ltog ${S.listShow?'on':''}" onclick="togListAll()">${S.listShow?'意味を隠す':'意味を表示'}</button>
  </div>`;

  h+='<div class="wl"><table class="wtbl"><colgroup><col class="c-n"><col class="c-e"><col class="c-r"><col class="c-m"></colgroup><thead><tr><th></th><th>語形</th><th></th><th>意味</th></tr></thead><tbody>';
  filtered.forEach(e=>{
    const rt=S.ratings[e.f]||'';
    const rc=rt==='◎'?'rm':rt==='○'?'ro':rt==='△'?'rt':'';
    const vis=S.listShow||S.listToggles[e.f];
    let mHtml;
    if(vis){
      mHtml=esc(e.m);
    }else{
      mHtml='<span class="tm-h">'+hintNums(e.m)+'</span>';
    }
    const fi=_fl.length;_fl.push(e.f);
    h+=`<tr class="${rc}">
      <td>${e.n}</td>
      <td class="te">${esc(e.f)}</td>
      <td class="tr"><button class="rbtn r-m ${rt==='◎'?'sel':''}" onclick="setRateI(${fi},'◎')">◎</button><button class="rbtn r-o ${rt==='○'?'sel':''}" onclick="setRateI(${fi},'○')">○</button><button class="rbtn r-t ${rt==='△'?'sel':''}" onclick="setRateI(${fi},'△')">△</button></td>
      <td class="tm" onclick="togListI(${fi})">${mHtml}</td>
    </tr>`;
  });
  h+='</tbody></table></div>';
  return h;
}

function renderTriangle(){
  const wAll=wrongCountMin(0),w1=wrongCountMin(1),w2=wrongCountMin(2),w3=wrongCountMin(3);
  let h='';

  // Filter chips
  h+=`<div class="frow">
    <div class="fchip f0 ${S.tfilter===0?'active':''}" onclick="setTF(0)">全部 ${wAll}</div>
    <div class="fchip f1 ${S.tfilter===1?'active':''}" onclick="setTF(1)">△ ${w1}</div>
    <div class="fchip f2 ${S.tfilter===2?'active':''}" onclick="setTF(2)">△△ ${w2}</div>
    <div class="fchip f3 ${S.tfilter===3?'active':''}" onclick="setTF(3)">△△△ ${w3}</div>
  </div>`;

  const entries=S.order;
  if(!entries.length){
    if(S.tfilter===0)return h+`<div class="empty"><div class="ei">✨</div><p>間違えた単語はまだありません。<br>クイズやカードで△をつけると追加されます。</p></div>`;
    return h+`<div class="empty"><div class="ei">👀</div><p>この条件の単語はありません</p></div>`;
  }

  // Sub-mode + controls
  h+=`<div class="cr" style="justify-content:space-between">
    <div style="display:flex;gap:6px">
      <button class="sb ${S.tsub==='list'?'active':''}" onclick="setTSub('list')">一覧</button>
      <button class="sb ${S.tsub==='flash'?'active':''}" onclick="setTSub('flash')">カード</button>
      <button class="sb ${S.tsub==='quiz'?'active':''}" onclick="setTSub('quiz')">クイズ</button>
    </div>
    <div style="display:flex;gap:6px">
      <button class="sb ${S.dir==='jp2en'?'active':''}" onclick="togDir()">${S.dir==='en2jp'?'英→和':'和→英'}</button>
      <button class="sb ${S.shuf?'active':''}" onclick="togShuf()">🔀</button>
    </div>
  </div>`;

  h+=`<div class="pw"><div class="pt" style="text-align:left;font-weight:600;color:var(--w1)">${entries.length} 語</div></div>`;

  const cur=entries[S.ci];
  if(S.tsub==='list'){
    h+='<div class="wl">';
    entries.forEach((e,idx)=>{
      const wc=e.wc||S.wrongs[e.f]||0;
      h+=`<div class="wi ${wcClass(wc)}">
        <span class="win">${e.n}</span>
        <span class="wie">${esc(e.f)}</span>
        <span class="wim">${esc(e.m)}</span>
        <span class="wic">${wcLabel(wc)}</span>
        <button class="wir" onclick="rmWrong(${idx})" title="削除">✕</button>
      </div>`;
    });
    h+='</div>';
  }else if(S.tsub==='flash'){
    h+=renderFlash(entries,cur);
  }else if(S.tsub==='quiz'){
    h+=renderQuiz(entries,cur,entries.length>=4?entries:getWrongEntries(0));
  }
  return h;
}

function renderPassage(){
  const ri=S.ri;
  const cached=S.passCache[ri];
  if(S.passLoading){
    return`<div class="pass-loading"><div class="spinner"></div><p>${S.passStep||'長文を生成中…'}</p></div>`;
  }
  if(S.passError){
    return`<div class="pass-error"><p>${esc(S.passError)}</p><button class="pass-btn" onclick="genPassage()" style="margin-top:12px">再試行</button></div>`;
  }
  // Count how many ranges have passages
  const genCount=Object.keys(S.passCache).filter(k=>S.passCache[k]&&S.passCache[k].en).length;
  let statusHtml=`<div style="font-size:11px;color:var(--sub);margin-bottom:10px;text-align:center">生成済み: ${genCount} / 26 範囲</div>`;

  if(cached&&cached.en){
    const hws=getHeadwords(ri);
    const lang=S.passLang||'en';
    let h=statusHtml;
    h+=`<div class="pass-meta"><span>${RNG[ri].l}（${hws.length}語）</span><button class="pass-regen" onclick="genPassage()">再生成</button></div>`;
    h+=`<div class="pass-lang">
      <button class="${lang==='en'?'active':''}" onclick="setPassLang('en')">English</button>
      <button class="${lang==='ja'?'active':''}" onclick="setPassLang('ja')">日本語訳</button>
      <button class="${lang==='both'?'active':''}" onclick="setPassLang('both')">並列</button>
    </div>`;
    if(lang==='en') h+=`<div class="passage-box">${cached.en}</div>`;
    else if(lang==='ja') h+=`<div class="passage-box ja">${cached.ja}</div>`;
    else h+=`<div class="passage-box">${cached.en}</div><div style="height:12px"></div><div class="passage-box ja">${cached.ja}</div>`;
    return h;
  }
  const hws=getHeadwords(ri);
  let h=statusHtml;
  h+=`<div class="pass-gen"><p>この範囲の見出し語 <strong>${hws.length}語</strong> をすべて含む英語長文を生成します。</p>
    <button class="pass-btn" onclick="genPassage()">この範囲を生成</button>
    <div style="margin-top:16px"><button class="pass-btn" style="background:var(--w1)" onclick="genAllPassages()">全範囲を一括生成</button></div>
    <p style="margin-top:16px;font-size:12px;color:var(--sub)">※ GitHub Pages上ではAPI生成は使えません。<br>Claude上で生成→⚙保存→GitHub版で復元してください。</p>
  </div>`;
  return h;
}

    <h2>設定</h2>
    <div class="sh-sec">データの保存・復元</div>

    <div class="sh-sec">リセット</div>

    <div class="sr"><span class="sl">全進捗リセット</span><button class="sb" onclick="resetAP()">全リセット</button></div>
    <div class="sr"><span class="sl">△リスト全削除</span><button class="sb" onclick="clearW()">全削除</button></div>
    <div class="sr"><span class="sl">生成済み長文を削除</span><button class="sb" onclick="clearPass()">削除</button></div>
    <div class="sr"><span class="sl">◎○△評価を全リセット</span><button class="sb" onclick="clearRatings()">リセット</button></div>

  </div></div>`;
}

// ===== Actions =====
function selRange(i){S.ri=i;S.listShow=false;S.listToggles={};S._scrollChip=true;buildOrder();render()}
function setMode(m){S.mode=m;S.ci=0;S.flip=false;S.qa=null;S.qo=[];S.passError=null;S._scrollChip=true;if(m==='triangle')S.tsub='list';buildOrder();render()}
function setTF(f){S.tfilter=f;buildOrder();render()}
function setTSub(sub){S.tsub=sub;S.ci=0;S.flip=false;S.qa=null;S.qo=[];buildOrder();render()}
function flipCard(){S.flip=!S.flip;render()}

function markOk(){
  const c=S.order[S.ci];if(c){S.prog[c.f]=1;sv('pp_prog',S.prog)}
  S.ci++;S.flip=false;render();
}
function markWrong(){
  const c=S.order[S.ci];if(c){addWrong(c.f);S.prog[c.f]=1;sv('pp_prog',S.prog)}
  S.ci++;S.flip=false;render();
}
function prevCard(){if(S.ci>0){S.ci--;S.flip=false;render()}}

function ansQuiz(i){
  if(S.qa!==null)return;S.qa=i;
  const c=S.order[S.ci];
  if(S.qo[i].ok){S.prog[c.f]=1;sv('pp_prog',S.prog)}
  else{addWrong(c.f)}
  render();
}
function nxtQuiz(){S.ci++;S.qa=null;S.qo=[];render()}
function resetQuiz(){buildOrder();S.qa=null;S.qo=[];render()}

function togShuf(){S.shuf=!S.shuf;buildOrder();render()}
function togDir(){S.dir=S.dir==='en2jp'?'jp2en':'en2jp';S.qa=null;S.qo=[];render()}
function togSet(){S.showSet=!S.showSet;render()}

function rmWrong(idx){
  const e=S.order[idx];if(!e)return;
  delete S.wrongs[e.f];sv('pp_wrongs',S.wrongs);
  buildOrder();render();
}
function clearW(){S.wrongs={};sv('pp_wrongs',S.wrongs);togSet();buildOrder();render()}
function resetRP(){
  const r=RNG[S.ri];for(let i=r.s;i<r.e;i++)DATA[i][1].forEach(([f])=>{delete S.prog[f]});
  sv('pp_prog',S.prog);togSet();render();
}
function resetAP(){S.prog={};sv('pp_prog',S.prog);togSet();render()}
function clearPass(){S.passCache={};svS('pp_passages','{}');togSet();render()}

// ===== List Actions =====
function encF(f){return f.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function hintNums(m){
  const nums=m.match(/[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮]/g);
  if(nums&&nums.length>=1)return nums.map(n=>'<span class="hn">'+n+'</span>').join(' ')+'…';
  return '…';
}
let _fl=[];
function setRateI(i,r){setRate(_fl[i],r)}
function togListI(i){togListItem(_fl[i])}
function setRate(f,r){
  if(S.ratings[f]===r){delete S.ratings[f]}else{S.ratings[f]=r}
  // Sync △ rating with wrongs
  if(r==='△'&&S.ratings[f]==='△'){S.wrongs[f]=(S.wrongs[f]||0)+1;sv('pp_wrongs',S.wrongs)}
  sv('pp_ratings',S.ratings);render();
}
function togListAll(){S.listShow=!S.listShow;S.listToggles={};render()}
function togListItem(f){S.listToggles[f]=!S.listToggles[f];render()}
function setLF(f){S.listFilter=f;render()}
function clearRatings(){S.ratings={};sv('pp_ratings',S.ratings);togSet();render()}

// ===== Data Export / Import =====
function exportData(){
  const data={
    version:1,
    date:new Date().toISOString(),
    progress:S.prog,
    wrongs:S.wrongs,
    ratings:S.ratings,
    passages:S.passCache
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date();
  a.href=url;
  a.download=`ponpon_backup_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(evt){
  const file=evt.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.progress&&!data.wrongs&&!data.ratings)throw new Error('無効なファイル');
      // Merge: imported data overwrites existing keys
      if(data.progress){Object.assign(S.prog,data.progress);sv('pp_prog',S.prog)}
      if(data.wrongs){Object.assign(S.wrongs,data.wrongs);sv('pp_wrongs',S.wrongs)}
      if(data.ratings){Object.assign(S.ratings,data.ratings);sv('pp_ratings',S.ratings)}
      if(data.passages){Object.assign(S.passCache,data.passages);svS('pp_passages',JSON.stringify(S.passCache))}
      buildOrder();
      S.showSet=false;render();
      setTimeout(()=>{alert('学習データを復元しました')},100);
    }catch(err){
      alert('読み込みに失敗しました: '+err.message);
    }
    evt.target.value='';
  };
  reader.readAsText(file);
}

// ===== Passage Generation =====
function setPassLang(l){S.passLang=l;render()}

async function callAPI(prompt,maxTok){
  const resp=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:maxTok||4000,messages:[{role:"user",content:prompt}]})
  });
  if(!resp.ok)throw new Error(`API error: ${resp.status}`);
  const data=await resp.json();
  return data.content.map(c=>c.text||'').join('');
}

async function genPassage(){
  const ri=S.ri;const hws=getHeadwords(ri);
  S.passLoading=true;S.passError=null;S.passStep='英語長文を生成中…';render();
  try{await genOnePassage(ri);S.passLoading=false;S.passError=null;S.passStep=null;S.passLang='en';}
  catch(e){S.passLoading=false;S.passStep=null;S.passError='生成に失敗しました。（'+e.message+'）';}
  render();
}

async function genOnePassage(ri){
  const hws=getHeadwords(ri);
  const enPrompt=`You are creating English reading material for a Japanese university entrance exam student.

Write a natural, engaging English passage (800-1200 words) that incorporates ALL of the following ${hws.length} English words at least once each. The passage can be a story, essay, article, or any coherent format.

Requirements:
- Use each word naturally in context so its meaning is clear
- Wrap each target word with <mark> tags THE FIRST TIME it appears (e.g., <mark>shine</mark>)
- The passage should be at an intermediate-to-advanced level
- Make it interesting and educational
- Do NOT list or explain individual words — only write the passage itself
- Write ONLY the HTML-formatted passage, no preamble

Target words: ${hws.join(', ')}`;

  const enText=await callAPI(enPrompt,4000);

  const jaPrompt=`以下の英語長文を自然な日本語に翻訳してください。

ルール:
- <mark>タグで囲まれた英単語は、翻訳文でも対応する日本語部分を<mark>タグで囲んでください
- 自然で読みやすい日本語にしてください
- 段落構成は原文に合わせてください
- 翻訳文のみを出力し、前置きや説明は不要です

英文:
${enText}`;

  const jaText=await callAPI(jaPrompt,4000);
  S.passCache[ri]={en:enText,ja:jaText};
  svS('pp_passages',JSON.stringify(S.passCache));
}

async function genAllPassages(){
  if(!confirm('全26範囲の長文を生成します。\n所要時間: 約20〜30分\n途中経過は自動保存されます。\n\n開始しますか？'))return;
  S.passLoading=true;S.passError=null;
  for(let i=0;i<26;i++){
    if(S.passCache[i]&&S.passCache[i].en){
      continue; // skip already generated
    }
    S.passStep=`長文を生成中… ${i+1}/26（${RNG[i].l}）`;render();
    try{
      await genOnePassage(i);
    }catch(e){
      S.passLoading=false;S.passStep=null;
      S.passError=`範囲 ${RNG[i].l} で失敗しました。（${e.message}）\n生成済み分は保存されています。再度「全範囲を一括生成」で続きから再開できます。`;
      render();return;
    }
  }
  S.passLoading=false;S.passStep=null;S.passError=null;S.passLang='en';
  render();
  alert('全26範囲の長文を生成しました！\n⚙「保存」でバックアップしてGitHub Pages版に復元できます。');
}

buildOrder();render();
